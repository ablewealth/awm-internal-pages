<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax-Aware Compounding Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    /* Range slider accent fallback */
    input[type="range"].accent-blue-600 { accent-color: #2563eb; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo } = React;
    const {
      LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer
    } = Recharts;

    /* ---------- Inline lucide-style icons (replacing lucide-react) ---------- */
    const iconBase = {
      xmlns: "http://www.w3.org/2000/svg",
      width: 24, height: 24, viewBox: "0 0 24 24",
      fill: "none", stroke: "currentColor", strokeWidth: 2,
      strokeLinecap: "round", strokeLinejoin: "round"
    };

    const Info = (props) => (
      <svg {...iconBase} {...props}>
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </svg>
    );

    const ChevronDown = (props) => (
      <svg {...iconBase} {...props}>
        <path d="m6 9 6 6 6-6" />
      </svg>
    );

    const DollarSign = (props) => (
      <svg {...iconBase} {...props}>
        <line x1="12" x2="12" y1="2" y2="22" />
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
      </svg>
    );

    const TrendingUp = (props) => (
      <svg {...iconBase} {...props}>
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
        <polyline points="16 7 22 7 22 13" />
      </svg>
    );

    const Landmark = (props) => (
      <svg {...iconBase} {...props}>
        <line x1="3" x2="21" y1="22" y2="22" />
        <line x1="6" x2="6" y1="18" y2="11" />
        <line x1="10" x2="10" y1="18" y2="11" />
        <line x1="14" x2="14" y1="18" y2="11" />
        <line x1="18" x2="18" y1="18" y2="11" />
        <polygon points="12 2 20 7 4 7" />
      </svg>
    );

    /* ---------- Formatters ---------- */
    const formatCurrency = (value) => {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0,
      }).format(value);
    };

    const formatCompactCurrency = (value) => {
      if (value >= 1e9) return `$${(value / 1e9).toFixed(1)}B`;
      if (value >= 1e6) return `$${(value / 1e6).toFixed(1)}M`;
      if (value >= 1e3) return `$${(value / 1e3).toFixed(1)}K`;
      return `$${value}`;
    };

    /* ---------- Slider control ---------- */
    const SliderControl = ({ label, value, min, max, step, onChange, format = "percent" }) => (
      <div className="flex flex-col space-y-2 w-full justify-end">
        <div className="flex justify-between items-center">
          <label className="text-sm font-medium text-slate-700 whitespace-nowrap">{label}</label>
          <div className="text-sm font-bold text-slate-900 bg-white shadow-sm border border-slate-100 px-2 py-1 rounded-md ml-2">
            {format === "percent" ? `${value}%` : value}
          </div>
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={(e) => onChange(parseFloat(e.target.value))}
          className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
        />
      </div>
    );

    /* ---------- Main App ---------- */
    function App() {
      const [initialInvestment, setInitialInvestment] = useState(1000000);
      const [grossReturn, setGrossReturn] = useState(10);
      const [annualDeduction, setAnnualDeduction] = useState(30);
      const [taxRate, setTaxRate] = useState(50.0);
      const [taxDrag, setTaxDrag] = useState(2.0);
      const [years, setYears] = useState(20);

      const [showDetails, setShowDetails] = useState(false);

      // Apply State Presets
      const applyPreset = (rate) => setTaxRate(rate);

      const data = useMemo(() => {
        let currentTaxAware = initialInvestment;
        let currentRegular = initialInvestment;
        const rows = [];

        // Start year (Year 0)
        rows.push({
          year: 0,
          name: 'Start',
          deduction: 0,
          taxSaved: 0,
          taxAware: currentTaxAware,
          regular: currentRegular,
          advantage: 0
        });

        for (let i = 1; i <= years; i++) {
          const deduction = currentTaxAware * (annualDeduction / 100);
          const taxSaved = deduction * (taxRate / 100);
          const returnAmount = currentTaxAware * (grossReturn / 100);

          currentTaxAware = currentTaxAware + returnAmount + taxSaved;

          const regularReturn = currentRegular * ((grossReturn - taxDrag) / 100);
          currentRegular = currentRegular + regularReturn;

          rows.push({
            year: i,
            name: `Yr ${i}`,
            deduction: deduction,
            taxSaved: taxSaved,
            taxAware: currentTaxAware,
            regular: currentRegular,
            advantage: currentTaxAware - currentRegular
          });
        }
        return rows;
      }, [initialInvestment, grossReturn, annualDeduction, taxRate, taxDrag, years]);

      const chartData = data.map(d => ({
        ...d,
        taxAwarePlot: d.taxAware,
        regularPlot: d.regular
      }));

      const finalData = data[data.length - 1];

      const CustomTooltip = ({ active, payload, label }) => {
        if (active && payload && payload.length) {
          return (
            <div className="bg-white p-4 border border-slate-200 shadow-xl rounded-lg">
              <p className="font-bold text-slate-800 mb-2 border-b pb-1">{label}</p>
              {payload.map((entry, index) => (
                <div key={index} className="flex items-center space-x-2 text-sm my-1">
                  <div className="w-3 h-3 rounded-full" style={{ backgroundColor: entry.color }} />
                  <span className="text-slate-600">{entry.name}:</span>
                  <span className="font-bold">{formatCurrency(entry.value)}</span>
                </div>
              ))}
              <div className="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-sm">
                <span className="text-slate-600">Advantage:</span>
                <span className="font-bold text-red-700">
                  +{formatCurrency(payload[0].value - payload[1].value)}
                </span>
              </div>
            </div>
          );
        }
        return null;
      };

      return (
        <div className="min-h-screen bg-slate-50 py-8 px-4 sm:px-6 lg:px-8 font-sans">
          <div className="max-w-6xl mx-auto space-y-6">

            {/* Header Section */}
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
                <div>
                  <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <TrendingUp className="text-blue-600" />
                    Tax-Aware Compounding Engine
                  </h1>
                  <p className="text-slate-500 mt-1">Compare tax-optimized strategies against regular investments</p>
                </div>

                {/* Presets */}
                <div className="mt-4 md:mt-0 flex flex-wrap gap-2">
                  <span className="text-sm text-slate-500 flex items-center mr-2">Tax Presets:</span>
                  <button onClick={() => applyPreset(51.70)} className="px-3 py-1.5 text-xs font-semibold bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 border border-blue-200 transition-colors">
                    NY (51.70%)
                  </button>
                  <button onClick={() => applyPreset(51.55)} className="px-3 py-1.5 text-xs font-semibold bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 border border-blue-200 transition-colors">
                    NJ (51.55%)
                  </button>
                  <button onClick={() => applyPreset(37.0)} className="px-3 py-1.5 text-xs font-semibold bg-slate-100 text-slate-700 rounded-md hover:bg-slate-200 border border-slate-200 transition-colors">
                    Fed Only (37%)
                  </button>
                </div>
              </div>

              {/* Summary Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div className="bg-[#f8f7f2] rounded-xl p-5 shadow-sm border border-slate-100/50">
                  <h3 className="text-sm font-semibold text-slate-600 mb-2">Starting capital</h3>
                  <p className="text-2xl font-bold text-slate-900">{formatCurrency(initialInvestment)}</p>
                </div>
                <div className="bg-[#f8f7f2] rounded-xl p-5 shadow-sm border border-slate-100/50">
                  <h3 className="text-sm font-semibold text-slate-600 mb-2">Tax-aware ending wealth</h3>
                  <p className="text-2xl font-bold text-[#2d5d9c]">{formatCurrency(finalData.taxAware)}</p>
                </div>
                <div className="bg-[#f8f7f2] rounded-xl p-5 shadow-sm border border-slate-100/50">
                  <h3 className="text-sm font-semibold text-slate-600 mb-2">Regular ending wealth</h3>
                  <p className="text-2xl font-bold text-[#517a44]">{formatCurrency(finalData.regular)}</p>
                </div>
                <div className="bg-[#f8f7f2] rounded-xl p-5 shadow-sm border border-slate-100/50 relative">
                  <h3 className="text-sm font-semibold text-slate-600 mb-2">Wealth advantage</h3>
                  <p className="text-2xl font-bold text-[#a63434]">+{formatCurrency(finalData.advantage)}</p>
                  <div className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 cursor-pointer bg-white rounded shadow-sm p-0.5">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                  </div>
                </div>
              </div>

              {/* Controls */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 p-4 bg-[#f8f9fa] rounded-xl border border-slate-100 items-end">
                <div className="flex flex-col space-y-2">
                   <label className="text-sm font-medium text-slate-700 whitespace-nowrap">Initial Invest.</label>
                   <div className="relative">
                     <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                       <DollarSign className="h-4 w-4 text-slate-400" />
                     </div>
                     <input
                       type="text"
                       value={initialInvestment.toLocaleString('en-US')}
                       onChange={(e) => {
                         const val = e.target.value.replace(/[^0-9]/g, '');
                         setInitialInvestment(val ? Number(val) : 0);
                       }}
                       className="pl-8 block w-full py-2 border-slate-300 border rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm font-bold text-slate-900"
                     />
                   </div>
                </div>
                <SliderControl label="Gross return" value={grossReturn} min={0} max={30} step={0.1} onChange={setGrossReturn} />
                <SliderControl label="Annual deduction" value={annualDeduction} min={0} max={100} step={1} onChange={setAnnualDeduction} />
                <SliderControl label="Tax rate" value={taxRate} min={0} max={60} step={0.05} onChange={setTaxRate} />
                <SliderControl label="Tax drag" value={taxDrag} min={0} max={10} step={0.1} onChange={setTaxDrag} />
                <SliderControl label="Years" value={years} min={1} max={40} step={1} onChange={setYears} format="number" />
              </div>
            </div>

            {/* Chart Section */}
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <div className="h-[400px] w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={chartData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis
                      dataKey="name"
                      axisLine={false}
                      tickLine={false}
                      tick={{ fill: '#64748b', fontSize: 12 }}
                      dy={10}
                      angle={-45}
                      textAnchor="end"
                      height={60}
                    />
                    <YAxis
                      tickFormatter={formatCompactCurrency}
                      axisLine={false}
                      tickLine={false}
                      tick={{ fill: '#64748b', fontSize: 12 }}
                      dx={-10}
                    />
                    <Tooltip content={<CustomTooltip />} />
                    <Legend
                      verticalAlign="top"
                      height={36}
                      iconType="circle"
                      wrapperStyle={{ fontSize: '14px', fontWeight: 500 }}
                    />
                    <Line
                      type="monotone"
                      dataKey="taxAwarePlot"
                      name="Tax-aware fund"
                      stroke="#1d4ed8"
                      strokeWidth={3}
                      dot={{ r: 4, fill: '#1d4ed8', strokeWidth: 2, stroke: '#fff' }}
                      activeDot={{ r: 6 }}
                    />
                    <Line
                      type="monotone"
                      dataKey="regularPlot"
                      name="Regular investment"
                      stroke="#16a34a"
                      strokeWidth={2}
                      strokeDasharray="5 5"
                      dot={{ r: 4, fill: '#16a34a', strokeWidth: 2, stroke: '#fff' }}
                    />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* Table Section */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-right">
                  <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                    <tr>
                      <th className="px-6 py-4 text-left">Yr</th>
                      <th className="px-6 py-4">Deduction</th>
                      <th className="px-6 py-4">Tax saved</th>
                      <th className="px-6 py-4 text-blue-700">Tax-aware value</th>
                      <th className="px-6 py-4 text-green-700">Regular value</th>
                      <th className="px-6 py-4 text-red-700">Advantage</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {data.slice(1).map((row) => (
                      <tr key={row.year} className="hover:bg-slate-50 transition-colors">
                        <td className="px-6 py-4 font-bold text-slate-900 text-left">{row.year}</td>
                        <td className="px-6 py-4 text-slate-600">{formatCurrency(row.deduction)}</td>
                        <td className="px-6 py-4 text-slate-600">{formatCurrency(row.taxSaved)}</td>
                        <td className="px-6 py-4 font-semibold text-blue-700 bg-blue-50/30">{formatCurrency(row.taxAware)}</td>
                        <td className="px-6 py-4 font-semibold text-green-700 bg-green-50/30">{formatCurrency(row.regular)}</td>
                        <td className="px-6 py-4 font-bold text-red-700">+{formatCurrency(row.advantage)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Context / Info Section */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <button
                onClick={() => setShowDetails(!showDetails)}
                className="w-full px-6 py-4 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition-colors"
              >
                <div className="flex items-center space-x-2">
                  <Landmark className="text-slate-600 h-5 w-5" />
                  <span className="font-semibold text-slate-800">Strategy Mechanics: NY &amp; NJ Optimization</span>
                </div>
                <ChevronDown className={`h-5 w-5 text-slate-500 transition-transform ${showDetails ? 'rotate-180' : ''}`} />
              </button>

              {showDetails && (
                <div className="p-6 text-slate-600 space-y-4 text-sm leading-relaxed border-t border-slate-200">
                  <p>
                    <strong className="text-slate-800">The Deduction Engine:</strong> The core investment is a specialized trader fund operating under IRC Section 475(f) that generates substantial ordinary losses to offset your highest-taxed income.
                  </p>
                  <ul className="list-disc pl-5 space-y-2">
                    <li>
                      <strong className="text-slate-800">New Jersey Resident:</strong> Facing a combined top marginal ordinary rate of 51.55% (37% Federal + 10.75% NJ + 3.8% NIIT), a $300,000 ordinary loss on a $1M investment yields roughly $154,650 in hard cash tax savings in year one.
                    </li>
                    <li>
                      <strong className="text-slate-800">New York Resident:</strong> Facing a top combined marginal rate of 51.70% (37% Federal + 10.90% NY + 3.8% NIIT), that same $300,000 ordinary loss yields approximately $155,100 in year-one tax savings.
                    </li>
                  </ul>

                  <p>
                    <strong className="text-slate-800">The Compounding Flywheel:</strong> The exponential growth relies on strict discipline. The investor does not spend the tax savings; they immediately reinvest it back into the ecosystem. In year two, the capital base is larger, generating a larger ordinary deduction, yielding larger tax savings, which are reinvested again.
                  </p>

                  <div className="bg-slate-100 p-4 rounded-lg mt-4 border border-slate-200">
                    <h4 className="font-bold text-slate-800 mb-2 flex items-center"><Info className="h-4 w-4 mr-2 text-blue-600"/> Recapture Mitigation (Exit Strategy)</h4>
                    <p className="mb-2">The generation of ordinary deductions lowers your cost basis. The tool mitigates this via three sophisticated exit paths:</p>
                    <ul className="list-disc pl-5 space-y-1">
                      <li><strong>Tax-Loss Harvesting:</strong> Building up excess capital loss carryforwards via the long/short overlay to absorb the eventual exit gains.</li>
                      <li><strong>Tax Character Arbitrage:</strong> Paying Long-Term Capital Gains (LTCG) rates upon redemption (NJ: 34.55%, NY: 34.70%), permanently avoiding the ~51.55% ordinary rates.</li>
                      <li><strong>Step-Up in Basis:</strong> Holding the asset within the estate until death (IRC § 1014), permanently eliminating the deferred liability.</li>
                    </ul>
                  </div>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
